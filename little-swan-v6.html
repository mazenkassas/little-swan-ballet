function SB({s}){const m=SM[s]||{l:s,c:C.muted};return h(Badge,{label:m.l,color:m.c,dot:m.d});}

function IR({l,v,last}){return h('div',{style:{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:last?'none':`1px solid ${C.border}`,gap:12}},h('span',{style:{color:C.muted,fontSize:12,flexShrink:0}},l),h('span',{style:{color:C.text,fontSize:12,fontWeight:500,textAlign:'right'}},v));}

  const today=new Date();
  const todayAr=DAYS_AR[today.getDay()];
  const todayDate=today.toLocaleDateString('ar-EG');

  const[groups,setGroups]=useState(GROUPS_TODAY);
  const[cashRows,setCashRows]=useState([

  const setMk=(gid,sid,field,val)=>setGroups(gs=>gs.map(g=>g.id!==gid?g:{...g,students:g.students.map(s=>s.id!==sid?s:{...s,[field]:val})}));
  const setNote=(gid,sid,val)=>setGroups(gs=>gs.map(g=>g.id!==gid?g:{...g,students:g.students.map(s=>s.id!==sid?s:{...s,notes:val})}));

  const confirmPay=(sid,form)=>{
    const allSt=groups.flatMap(g=>g.students);

    const amount=parseFloat(form.amount)||0;
    const newRow={id:'R'+Date.now(),name:st.name,amount,type:form.type};
    if(form.method==='كاش') setCashRows(p=>[...p,newRow]);
    else setInstaRows(p=>[...p,newRow]);
    // update student sessions

      if(s.id!==sid) return s;
      if(form.type==='اشتراك') return {...s,status:'تم الدفع',sessionsLeft:4};
      return s;
    })})));
    setPayModal(null);

  const cashTotal=cashRows.reduce((a,r)=>a+(parseFloat(r.amount)||0),0);

// LOGIN — fixed: quick buttons login directly (no second click)
// ═══════════════════════════════════════════════════════════════
function Login({onLogin}){
  const[email,setEmail]=useState('');
  const[pass,setPass]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);

  const doLogin=(em,pw)=>{
    const e=em??email, p=pw??pass;
    if(!e||!p){setErr('ادخل الإيميل وكلمة المرور');return;}
    setLoading(true);setErr('');
    setTimeout(()=>{
      const u=USERS.find(x=>x.email===e&&x.pass===p);
      if(u){onLogin(u);}else{setErr('الإيميل أو كلمة المرور غلط');setLoading(false);}
    },400);
  };

  const DEMO=[
    {label:'Super Admin',sub:'كل الصلاحيات',color:C.accent,u:USERS[0]},
    {label:'Staff — مريم',sub:'العمليات اليومية',color:C.purple,u:USERS[1]},
    {label:'Coach Dina',sub:'المدربة',color:C.blue,u:USERS[3]},
  ];

  return h('div',{style:{display:'flex',width:'100vw',height:'100vh',background:`linear-gradient(135deg,#fdf8f6 0%,#fde8ec 50%,#f8e0f0 100%)`,alignItems:'center',justifyContent:'center'}},
    h('div',{style:{width:440}},
      h('div',{style:{textAlign:'center',marginBottom:26}},
        h('div',{style:{width:60,height:60,borderRadius:18,background:`linear-gradient(135deg,${C.accent},#c04060)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,margin:'0 auto 12px',boxShadow:`0 8px 24px ${C.accent}40`}},'🦢'),
        h('h1',{style:{color:C.text,fontSize:22,fontWeight:800,margin:'0 0 4px',letterSpacing:-0.5}},'Little Swan Ballet Academy'),
        h('p',{style:{color:C.muted,fontSize:13,margin:0}},'Miami Branch — Management System')
      ),
      h(Card,{style:{boxShadow:`0 8px 32px rgba(212,102,122,0.12)`}},
        h('p',{style:{color:C.text,fontSize:15,fontWeight:700,margin:'0 0 16px',textAlign:'center'}},'تسجيل الدخول'),
        h('div',{style:{marginBottom:12}},
          h('label',{style:{display:'block',color:C.sub,fontSize:11,fontWeight:600,marginBottom:4,letterSpacing:0.3}},'البريد الإلكتروني'),
          h('input',{value:email,onChange:e=>setEmail(e.target.value),placeholder:'your@email.com',type:'email',
            style:{width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:8,fontSize:13,color:C.text,outline:'none'}})
        ),
        h('div',{style:{marginBottom:16}},
          h('label',{style:{display:'block',color:C.sub,fontSize:11,fontWeight:600,marginBottom:4,letterSpacing:0.3}},'كلمة المرور'),
          h('input',{value:pass,onChange:e=>setPass(e.target.value),placeholder:'Password',type:'password',
            onKeyDown:e=>e.key==='Enter'&&doLogin(),
            style:{width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:8,fontSize:13,color:C.text,outline:'none'}})
        ),
        err&&h('p',{style:{color:C.red,fontSize:12,fontWeight:600,margin:'-8px 0 12px',textAlign:'center'}},err),
        h('button',{onClick:()=>doLogin(),disabled:loading,
          style:{width:'100%',background:`linear-gradient(135deg,${C.accent},#c04060)`,border:'none',borderRadius:9,padding:'11px',color:'#fff',fontSize:13,fontWeight:700,cursor:loading?'default':'pointer',opacity:loading?0.8:1}},
          loading?'جاري الدخول…':'دخول ←')
      ),
      h('div',{style:{marginTop:12}},
        h('p',{style:{color:C.muted,fontSize:10,textAlign:'center',marginBottom:8,fontWeight:600,letterSpacing:0.5}},'اضغط للدخول مباشرة'),
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}},
          DEMO.map(q=>h('button',{key:q.label,
            onClick:()=>doLogin(q.u.email,q.u.pass),
            style:{background:q.color+'12',border:`1px solid ${q.color}35`,borderRadius:9,padding:'10px 6px',cursor:'pointer',textAlign:'center'}},
            h('p',{style:{color:q.color,fontSize:11,fontWeight:700,margin:'0 0 2px'}},q.label),
            h('p',{style:{color:C.muted,fontSize:9,margin:0}},q.sub)
          ))
        )
      )
    )
  );
}

// ═══════════════════════════════════════════════════════════════
// APP SHELL — ROLE ROUTING (with Yawmiya added)
// ═══════════════════════════════════════════════════════════════
function App(){
  const[user,setUser]=useState(null);
  const[active,setActive]=useState('yawmiya');

  const handleLogin=(u)=>{setUser(u);setActive(u.role==='coach'?'overview':'yawmiya');};
  const handleLogout=()=>{setUser(null);setActive('yawmiya');};

  if(!user) return h(Login,{onLogin:handleLogin});

  const ywScreen=h('div',{style:{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}},
    h('div',{style:{flex:1,overflowY:'auto'}},h(Yawmiya,null)));

  // ── SUPER ADMIN ────────────────────────────────────────────
  if(user.role==='superadmin'){
    const payReq=STUDENTS.filter(s=>s.remaining===0&&s.status==='active').length;
    const pendingTr=TRANSFERS.filter(t=>t.status==='pending').length;
    const lowStock=INVENTORY.filter(i=>i.type==='ready'&&i.stock===0).length;
    const navGroups=[
      {label:'ACADEMY',items:[{key:'overview',icon:'❀',label:'Overview'},{key:'yawmiya',icon:'📋',label:'اليومية'},{key:'students',icon:'🩰',label:'Students',badge:payReq},{key:'classes',icon:'🗓',label:'Classes & Halls'},{key:'attendance',icon:'✓',label:'Attendance'}]},
      {label:'FINANCE',items:[{key:'payments',icon:'💳',label:'Payments & Revenue'},{key:'expenses',icon:'📋',label:'Expenses'}]},
      {label:'OPERATIONS',items:[{key:'coaches',icon:'👩‍🏫',label:'Coaches & Payroll'},{key:'transfers',icon:'⇄',label:'Transfers',badge:pendingTr},{key:'exams',icon:'📝',label:'Exams & Levels'},{key:'inventory',icon:'👗',label:'Leotards',badge:lowStock},{key:'events',icon:'🎭',label:'Events'}]},
      {label:'SYSTEM',items:[{key:'stafflog',icon:'📍',label:'Staff Log'},{key:'settings',icon:'⚙',label:'Settings'}]},
    ];
    const screens={
      yawmiya:ywScreen,
      overview:h(SA_Overview,{setActive}),students:h(SA_Students,null),classes:h(SA_Classes,null),
      attendance:h(SA_Attendance,null),payments:h(SA_Payments,null),
      expenses:h('div',{style:{flex:1,overflowY:'auto',padding:'24px 28px',background:C.bg}},h(PH,{title:'Expenses',sub:'Daily operational costs',actions:[h(Btn,{key:'a',label:'+ Add Expense',primary:true})]}),h(Card,{pad:'0'},h('table',{style:{width:'100%',borderCollapse:'collapse'}},h('thead',null,h('tr',null,h(Th,null,'Description'),h(Th,null,'Amount'),h(Th,null,'Hall'),h(Th,null,'Date'))),h('tbody',null,EXPENSES.map(e=>h('tr',{key:e.id},h(Td,{bold:true},e.desc),h(Td,{color:C.red,bold:true},'$'+e.amount),h(Td,null,e.hall),h(Td,null,e.date))))))),
      coaches:h(SA_Coaches,null),transfers:h(SA_Transfers,null),exams:h(SA_Exams,null),
      inventory:h(SA_Inventory,null),events:h(SA_Events,null),
      stafflog:h(SA_StaffLog,null),settings:h(SA_Settings,null),
    };
    return h('div',{style:{display:'flex',width:'100vw',height:'100vh',background:C.bg,overflow:'hidden'}},
      h(Sidebar,{active,setActive,user,onLogout:handleLogout,navGroups}),
      h('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}},screens[active]||ywScreen)
    );
  }

  // ── STAFF ──────────────────────────────────────────────────
  if(user.role==='staff'){
    const payReq=STUDENTS.filter(s=>s.remaining===0&&s.status==='active').length;
    const navGroups=[
      {label:'اليومية',items:[{key:'yawmiya',icon:'📋',label:'اليومية'}]},
      {label:'STUDENTS',items:[{key:'students',icon:'🩰',label:'Students',badge:payReq},{key:'attendance',icon:'✓',label:'Mark Attendance'},{key:'payments',icon:'💳',label:'Record Payments'}]},
      {label:'MORE',items:[{key:'transfers',icon:'⇄',label:'Transfer Requests'},{key:'inventory',icon:'👗',label:'Leotard Sales'},{key:'expenses',icon:'📋',label:'Expenses'}]},
    ];
    const screens={
      yawmiya:ywScreen,
      students:h(ST_Students,null),attendance:h(ST_Attendance,null),
      payments:h(ST_Payments,null),transfers:h(ST_Transfers,null),
      inventory:h(ST_Inventory,null),expenses:h(ST_Expenses,null),
    };
    return h('div',{style:{display:'flex',width:'100vw',height:'100vh',background:C.bg,overflow:'hidden'}},
      h(Sidebar,{active,setActive,user,onLogout:handleLogout,navGroups}),
      h('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}},screens[active]||ywScreen)
    );
  }

  // ── COACH ──────────────────────────────────────────────────
  if(user.role==='coach'){
    const navGroups=[
      {label:'MY SESSIONS',items:[{key:'overview',icon:'❀',label:'Dashboard'},{key:'schedule',icon:'🗓',label:'My Schedule'},{key:'checkin',icon:'📍',label:'Check In / Out'}]},
      {label:'STUDENTS',items:[{key:'attendance',icon:'✓',label:'Confirm Attendance'}]},
    ];
    const screens={
      overview:h(CO_Overview,{user}),schedule:h(CO_Schedule,{user}),
      checkin:h(CO_CheckIn,{user}),attendance:h(CO_Attendance,{user}),
    };
    return h('div',{style:{display:'flex',width:'100vw',height:'100vh',background:C.bg,overflow:'hidden'}},
      h(Sidebar,{active,setActive,user,onLogout:handleLogout,navGroups}),
      h('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}},screens[active]||screens.overview)
    );
  }

  return null;
}

ReactDOM.render(h(App,null),document.getElementById('root'));
</script>
</body>
